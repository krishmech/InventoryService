name: Deploy Spring Boot to AWS EC2

on:
  push:
    branches: [ "Dev" ]   # Trigger only on Dev branch pushes

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Set up JDK
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'

      # 3. Build Spring Boot JAR with Maven
      - name: Build with Maven
        run: mvn clean package -DskipTests

      # 4. Set up SSH agent
      - name: Set up SSH
        uses: webfactory/ssh-agent@v0.7.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      # 5. Copy JAR to EC2
      - name: Copy JAR to EC2
        run: |
          scp -o StrictHostKeyChecking=no target/*.jar ec2-user@${{ secrets.EC2_IP }}:/home/ec2-user/app.jar

      # 6. Restart Spring Boot app on EC2
      - name: Restart Spring Boot app
        run: |
          ssh -o StrictHostKeyChecking=no ec2-user@${{ secrets.EC2_IP }} << 'EOF'
            # Kill existing process if running
            pkill -f 'java -jar' || true

            # Start new process in background
            nohup java -jar /home/ec2-user/app.jar > app.log 2>&1 &
          EOF
